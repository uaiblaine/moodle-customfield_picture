name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
#
# push is filtered to the branches that are merge targets. Without the filter
# every push to a feature branch ran the whole pipeline AND the pull_request
# event ran it again on the same commit - measured at 21 jobs and ~95 billable
# minutes per run, so exactly double for no extra information. A branch with no
# pull request open is covered by `mdl ci <repo> --matrix` locally.
on:
  push:
    branches:
      - master
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on master - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these jobs when the supported range changes,
  # in the same commit as the version.php change. The highest branch runs the
  # full PHP x DB matrix; older branches run one DB only. PHPUnit and Behat
  # run on every runtime leg.
  #
  # For plugins that depend on sibling plugins, add to each job:
  #   plugin-dependencies: uaiblaine/moodle-<component>,main
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true

  ci-405:
    name: Moodle 4.05
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_405_STABLE
      one-db-only: true
